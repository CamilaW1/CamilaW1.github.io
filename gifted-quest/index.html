<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gifted Quest — Grade 3</title><style>:root{--p:#5d5fef;--pd:#494ad0;--bg:#f6f7fb;--card:#fff;--text:#20223a;--muted:#73778f;--line:#e5e7f0;--ok:#2aa876}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#e9eaff 0,transparent 34rem),var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button{font:inherit}header{height:76px;width:min(1100px,calc(100% - 28px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{border:0;background:transparent;display:flex;gap:10px;align-items:center;color:var(--text);cursor:pointer}.brand span{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7779ff,#5153df);display:grid;place-items:center;color:#fff;font-weight:900}.reset{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:13px;cursor:pointer}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:14px 0 50px}.hero{background:linear-gradient(135deg,#6a6cf3,#7256d4);color:#fff;border-radius:28px;padding:30px;box-shadow:0 18px 40px #4b4f8f1f}.hero h1{font-size:clamp(32px,7vw,50px);line-height:1.02;letter-spacing:-.045em;margin:8px 0 12px}.hero p{max-width:700px;line-height:1.6;color:#ffffffd9}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.8}.progress{margin-top:24px;display:flex;gap:14px;align-items:center;background:#ffffff1c;border:1px solid #ffffff2d;padding:16px;border-radius:20px}.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--deg),#ffffff3b 0);position:relative;font-weight:900}.ring:after{content:"";position:absolute;inset:7px;background:#6662e3;border-radius:50%}.ring b{position:relative;z-index:1}.levels{display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px}.level{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 26px #30346b0b}.level.locked{opacity:.55}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.num{width:48px;height:48px;border-radius:15px;background:#eff0ff;color:var(--p);display:grid;place-items:center;font-weight:900}.pill{font-size:12px;font-weight:800;background:#f2f3f7;color:var(--muted);padding:7px 10px;border-radius:999px}.pill.done{background:#e9f8f2;color:#218560}.level h3{font-size:22px;margin:18px 0 6px}.level p{color:var(--muted);line-height:1.5;margin:0 0 18px}.btn{border:0;background:var(--p);color:#fff;border-radius:13px;padding:11px 16px;font-weight:900;cursor:pointer}.btn:disabled{background:#c5c8d5}.quiz{max-width:820px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 16px 38px #30346b12;overflow:hidden}.qhead,.actions{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.actions{border-bottom:0;border-top:1px solid var(--line)}.qmeta{text-align:center;color:var(--muted);font-size:12px;font-weight:800}.timer{background:#fff0ee;color:#bf534b;padding:9px 12px;border-radius:12px;font-weight:900;font-variant-numeric:tabular-nums}.bar{height:5px;background:#f1f2f7}.bar span{display:block;height:100%;background:linear-gradient(90deg,#5d5fef,#8b75ea)}.body{padding:30px 22px}.body h2{font-size:clamp(23px,5vw,32px);letter-spacing:-.035em;margin:0}.listen{margin-top:12px;border:1px solid var(--line);background:#fafaff;color:var(--p);border-radius:12px;padding:9px 11px;font-weight:800;cursor:pointer}.opts{display:grid;gap:12px;margin-top:24px}.opt{min-height:60px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 15px;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer}.opt.sel{border-color:var(--p);background:#f1f1ff}.letter{width:34px;height:34px;border-radius:10px;background:#f2f3f8;display:grid;place-items:center;font-weight:900;color:var(--muted);flex:0 0 auto}.opt.sel .letter{background:var(--p);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:13px;padding:11px 16px;font-weight:900;cursor:pointer}.visual{margin-top:22px}.sequence{display:flex;gap:10px;flex-wrap:wrap}.tile{min-width:64px;min-height:64px;border-radius:14px;background:#f7f8fc;display:grid;place-items:center}.shape{width:var(--s);height:var(--s);border:3px solid #30334f}.circle{border-radius:50%}.filled{background:#30334f}.diamond{transform:rotate(45deg)}.triangle{width:0;height:0;border:0;border-left:calc(var(--s)/2) solid transparent;border-right:calc(var(--s)/2) solid transparent;border-bottom:var(--s) solid #30334f;background:transparent}.arrow{border:0;background:#30334f;clip-path:polygon(0 34%,60% 34%,60% 0,100% 50%,60% 100%,60% 66%,0 66%);height:calc(var(--s)*.65)}.matrix{display:grid;grid-template-columns:repeat(2,76px);grid-template-rows:repeat(2,76px)}.cell{border:1px solid #ccd0dc;display:grid;place-items:center}.mark{font-size:28px;font-weight:900;color:var(--p)}.result{max-width:670px;margin:auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px 24px;box-shadow:0 16px 38px #30346b12}.star{width:74px;height:74px;margin:0 auto 18px;background:linear-gradient(135deg,#ffbd5a,#ff9f40);border-radius:23px;display:grid;place-items:center;color:#fff;font-size:34px}.result h1{font-size:clamp(30px,6vw,44px);margin:10px 0}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.score div{background:#f7f8fc;border-radius:16px;padding:16px 8px}.score b,.score small{display:block}.score b{font-size:24px}.score small{color:var(--muted);margin-top:4px}.stars{font-size:30px;color:#ffad37;letter-spacing:7px;margin-bottom:22px}@media(min-width:700px){.levels{grid-template-columns:repeat(2,1fr)}.hero{padding:38px}.body{padding:38px 40px}.actions{padding:18px 40px}}@media(min-width:1000px){.levels{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><button id="home" class="brand"><span>GQ</span><b>Gifted Quest</b></button><button id="reset" class="reset">↻</button></header><main id="app"></main><script>const levels=[{id:1,title:'Verbal Explorer',subtitle:'Analogies, vocabulary, categories',questions:[['Puppy is to dog as calf is to ____.',['cow','horse','goat','sheep'],0],['Which word does NOT belong?',['whisper','shout','speak','listen'],3],['Book is to library as painting is to ____.',['museum','brush','artist','frame'],0],['Choose the pair with the same relationship as “key : lock”.',['pencil : paper','password : account','shoe : sock','rain : cloud'],1],['Which word is most similar in meaning to “fragile”?',['strong','breakable','heavy','bright'],1],['Complete the analogy: inch : ruler :: minute : ____.',['clock','calendar','speed','hour'],0],['Which word belongs in both blanks? “A ___ can be on a tree, and a ___ can be in a book.”',['branch','leaf','page','cover'],1],['Which sentence shows an opposite relationship?',['A kitten is a young cat.','A giant is larger than a dwarf.','A robin is a kind of bird.','A spoon is used for eating.'],1]]},{id:2,title:'Number Detective',subtitle:'Patterns, operations, number relationships',questions:[['What comes next? 2, 5, 11, 23, ____',['35','46','47','48'],2],['What comes next? 81, 27, 9, 3, ____',['0','1','2','6'],1],['Which number does NOT belong? 12, 18, 24, 30, 35, 42',['18','24','35','42'],2],['A number is doubled, then 7 is added. The result is 25. What was the number?',['7','8','9','10'],2],['Three consecutive numbers add to 36. What is the middle number?',['10','11','12','13'],2],['Which expression has the greatest value?',['6 × 4','30 − 5','18 + 5','8 × 3'],1],['What number replaces the question mark? 4 → 10, 6 → 14, 9 → 20, 12 → ?',['22','24','26','28'],2],['Maya has twice as many stickers as Leo. Together they have 27 stickers. How many does Maya have?',['9','12','18','21'],2],['A pattern adds 2, then 4, then 6, then 8. Starting at 3, what is the fifth number?',['17','19','23','25'],2],['Which fraction is largest?',['1/2','2/3','3/5','4/7'],1]]},{id:3,title:'Logic Solver',subtitle:'Deduction, order, codes, reasoning',questions:[['All nims are blue. Some blue things are round. Which statement MUST be true?',['All round things are nims.','All nims are blue.','All blue things are nims.','No nims are round.'],1],['Ana is taller than Ben. Ben is taller than Cara. Who is shortest?',['Ana','Ben','Cara','Cannot know'],2],['Four children line up. Liam is before Noah. Emma is after Noah. Ava is before Liam. Who must be first?',['Ava','Liam','Noah','Emma'],0],['If today is Tuesday, what day will it be 10 days from now?',['Thursday','Friday','Saturday','Sunday'],1],['A red box is heavier than a blue box. A green box is lighter than the blue box. Which is heaviest?',['red','blue','green','Cannot know'],0],['Sam, Jo, and Kai each have one pet: cat, dog, fish. Sam does not have the cat. Jo does not have the dog. Kai has the fish. What pet does Sam have?',['cat','dog','fish','Cannot know'],1],['If every triangle has 3 corners and shape X has 4 corners, what can we conclude?',['X is a triangle.','X is not a triangle.','X is a circle.','Nothing can be concluded.'],1],['A code changes each letter to the next letter in the alphabet. CAT becomes DBU. What does DOG become?',['EPH','EOH','DPH','FQI'],0],['A train leaves at 2:35 and travels for 50 minutes. When does it arrive?',['3:15','3:20','3:25','3:30'],2],['There are 5 boxes. The prize is not in box 1 or 5. It is in an even-numbered box. Which boxes are possible?',['2 only','4 only','2 or 4','3 or 4'],2]]},{id:4,title:'Pattern Master',subtitle:'Visual sequences and transformations',visual:'sequence',questions:[['What comes next?',[['circle',16,0,0],['circle',16,1,0],['square',16,0,0],['square',16,1,0],['triangle',16,0,0]],[['triangle',16,1,0],['circle',16,0,0],['diamond',16,1,0],['square',16,1,0]],0],['What comes next?',[['arrow',18,0,0],['arrow',18,0,90],['arrow',18,0,180],['arrow',18,0,270]],[['arrow',18,0,0],['arrow',18,0,45],['arrow',18,0,90],['arrow',18,0,180]],0],['What comes next?',[['triangle',12,0,0],['triangle',18,0,0],['triangle',24,0,0]],[['triangle',30,0,0],['circle',30,0,0],['triangle',18,1,0],['square',30,0,0]],0],['What comes next?',[['square',16,0,0],['circle',16,0,0],['square',16,1,0],['circle',16,1,0]],[['square',16,0,0],['circle',16,0,0],['triangle',16,1,0],['square',16,1,0]],0],['What comes next?',[['diamond',14,0,0],['diamond',14,0,45],['diamond',14,0,90]],[['diamond',14,0,135],['diamond',14,0,180],['square',14,0,0],['triangle',14,0,0]],0],['What comes next?',[['circle',12,0,0],['square',16,0,0],['circle',20,0,0],['square',24,0,0]],[['circle',28,0,0],['square',28,0,0],['triangle',28,0,0],['circle',24,1,0]],0],['What comes next?',[['triangle',16,0,0],['square',16,0,0],['diamond',16,0,0],['triangle',16,0,0]],[['square',16,0,0],['circle',16,0,0],['diamond',16,0,0],['triangle',16,1,0]],0],['What comes next?',[['circle',14,0,0],['circle',18,0,0],['circle',22,0,0],['circle',26,0,0]],[['circle',30,0,0],['square',30,0,0],['circle',22,1,0],['triangle',30,0,0]],0]]},{id:5,title:'Matrix Master',subtitle:'2×2 visual matrices and rule changes',visual:'matrix',questions:[['Complete the matrix.',[['square',14,0,0],['square',24,0,0],['circle',14,0,0]],[['circle',24,0,0],['circle',14,0,0],['square',24,0,0],['triangle',24,0,0]],0],['Complete the matrix.',[['triangle',16,0,0],['triangle',16,1,0],['circle',16,0,0]],[['circle',16,1,0],['square',16,1,0],['circle',24,0,0],['triangle',16,0,0]],0],['Complete the matrix.',[['circle',12,0,0],['square',12,0,0],['circle',22,0,0]],[['square',22,0,0],['triangle',22,0,0],['circle',12,1,0],['square',12,1,0]],0],['Complete the matrix.',[['arrow',18,0,0],['arrow',18,0,90],['arrow',18,0,180]],[['arrow',18,0,270],['arrow',18,0,0],['arrow',18,0,90],['arrow',18,0,180]],0],['Complete the matrix.',[['diamond',14,0,0],['diamond',20,0,0],['square',14,1,0]],[['square',20,1,0],['diamond',20,1,0],['square',14,0,0],['circle',20,1,0]],0],['Complete the matrix.',[['circle',16,0,0],['triangle',16,0,0],['square',16,1,0]],[['diamond',16,1,0],['triangle',16,1,0],['square',16,0,0],['circle',16,1,0]],0]]},{id:6,title:'3-Minute Challenge',subtitle:'Fast mixed reasoning under time pressure',timed:true,questions:[['5, 9, 13, 17, ____',['19','20','21','22'],2],['Which word does NOT belong?',['oak','maple','rose','pine'],2],['If 3 boxes hold 4 balls each, how many balls are there?',['7','10','12','14'],2],['A, D, G, J, ____',['K','L','M','N'],2],['Which is greatest?',['3/4','2/3','5/8','1/2'],0],['If every zor is tall and Ben is not tall, which statement is true?',['Ben is a zor.','Ben is not a zor.','All tall people are zors.','Cannot know anything.'],1]]}];const app=document.getElementById('app'),homeBtn=document.getElementById('home'),resetBtn=document.getElementById('reset');const KEY='giftedQuestG3v1';let S={level:null,q:0,a:[],timer:null,left:180};const getP=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{done:{},best:{}}}catch{return{done:{},best:{}}}},saveP=p=>localStorage.setItem(KEY,JSON.stringify(p));function unlocked(id,p){return id===1||p.done[id-1]}function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}function home(){stop();const p=getP(),done=levels.filter(l=>p.done[l.id]).length,pc=Math.round(done/levels.length*100);app.innerHTML=`<section class="hero"><span class="eyebrow">6 LEVELS · 48 QUESTIONS</span><h1>Build strong reasoning skills, one level at a time.</h1><p>Verbal, quantitative, logic, visual patterns, matrices, and a final 3-minute challenge.</p><div class="progress"><div class="ring" style="--deg:${pc*3.6}deg"><b>${pc}%</b></div><div><b>${done} of 6 levels completed</b><div style="opacity:.75;margin-top:5px">Progress is saved on this device.</div></div></div></section><div class="levels" id="levels"></div>`;const g=document.getElementById('levels');levels.forEach(l=>{const ok=unlocked(l.id,p),d=!!p.done[l.id],e=document.createElement('article');e.className='level'+(ok?'':' locked');e.innerHTML=`<div class="row"><div class="num">${l.id}</div><span class="pill ${d?'done':''}">${d?'Completed':ok?'Ready':'Locked'}</span></div><h3>${l.title}</h3><p>${l.subtitle}</p><div class="row"><small>${p.best[l.id]!=null?'Best: '+p.best[l.id]+'%':l.questions.length+' questions'}</small><button class="btn" ${ok?'':'disabled'}>${d?'Practice':'Start'}</button></div>`;e.querySelector('button').onclick=()=>start(l.id);g.appendChild(e)})}function start(id){stop();S.level=levels.find(x=>x.id===id);S.q=0;S.a=Array(S.level.questions.length).fill(null);S.left=180;renderQ();if(S.level.timed)tick()}function shape(s){const[k,z,f,r]=s,e=document.createElement('span');e.className=`shape ${k}${f?' filled':''}`;e.style.setProperty('--s',`${Math.max(24,z*1.45)}px`);e.style.transform=`${k==='diamond'?'rotate(45deg) ':''}rotate(${r||0}deg)`;return e}function visual(q){const w=document.createElement('div');w.className='visual';if(S.level.visual==='sequence'){const row=document.createElement('div');row.className='sequence';q[1].forEach(s=>{const t=document.createElement('div');t.className='tile';t.appendChild(shape(s));row.appendChild(t)});const m=document.createElement('div');m.className='tile mark';m.textContent='?';row.appendChild(m);w.appendChild(row)}else{const grid=document.createElement('div');grid.className='matrix';q[1].forEach(s=>{const t=document.createElement('div');t.className='cell';t.appendChild(shape(s));grid.appendChild(t)});const m=document.createElement('div');m.className='cell mark';m.textContent='?';grid.appendChild(m);w.appendChild(grid)}return w}function renderQ(){const l=S.level,q=l.questions[S.q],visualMode=!!l.visual,ops=visualMode?q[2]:q[1],ans=visualMode?q[3]:q[2];app.innerHTML=`<section class="quiz"><div class="qhead"><button class="secondary" id="back">← Levels</button><div class="qmeta">LEVEL ${l.id} · ${l.title}<br>Question ${S.q+1} of ${l.questions.length}</div>${l.timed?`<div class="timer" id="timer">${fmt(S.left)}</div>`:'<span></span>'}</div><div class="bar"><span style="width:${(S.q+1)/l.questions.length*100}%"></span></div><div class="body"><h2>${q[0]}</h2><button class="listen" id="listen">🔊 Listen</button><div id="vis"></div><div class="opts" id="opts"></div></div><div class="actions"><button class="secondary" id="prev" ${S.q===0||l.timed?'disabled':''}>Previous</button><button class="btn" id="next" ${S.a[S.q]==null?'disabled':''}>${S.q===l.questions.length-1?'Finish':'Next'}</button></div></section>`;if(visualMode)document.getElementById('vis').appendChild(visual(q));const oe=document.getElementById('opts');ops.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(S.a[S.q]===i?' sel':'');const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);b.appendChild(letter);if(Array.isArray(o)){const t=document.createElement('span');t.className='tile';t.appendChild(shape(o));b.appendChild(t)}else{const sp=document.createElement('span');sp.textContent=o;b.appendChild(sp)}b.onclick=()=>{S.a[S.q]=i;[...oe.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('next').disabled=false};oe.appendChild(b)});document.getElementById('next').onclick=()=>{if(S.a[S.q]==null)return;if(S.q===l.questions.length-1)finish();else{S.q++;renderQ()}};document.getElementById('prev').onclick=()=>{if(S.q>0&&!l.timed){S.q--;renderQ()}};document.getElementById('back').onclick=()=>{if(confirm('Leave this level? This attempt will not be saved.'))home()};document.getElementById('listen').onclick=()=>speak(q,ops,visualMode)}function finish(){stop();const l=S.level;let c=0;l.questions.forEach((q,i)=>{const a=l.visual?q[3]:q[2];if(S.a[i]===a)c++});const pc=Math.round(c/l.questions.length*100),p=getP();p.done[l.id]=true;p.best[l.id]=Math.max(p.best[l.id]||0,pc);saveP(p);const stars=pc>=90?3:pc>=75?2:1,msg=pc>=90?'Excellent reasoning. You handled this level with strong accuracy.':pc>=75?'Strong work. You are ready to keep building on this level.':'Good practice. Try it again later and see how much more you notice.';app.innerHTML=`<section class="result"><div class="star">★</div><span class="eyebrow">LEVEL COMPLETE</span><h1>${l.title} complete!</h1><p>${msg}</p><div class="score"><div><b>${c}/${l.questions.length}</b><small>correct</small></div><div><b>${pc}%</b><small>score</small></div><div><b>${p.best[l.id]}%</b><small>best</small></div></div><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="row"><button class="secondary" id="retry">Try again</button><button class="btn" id="cont">${l.id===levels.length?'Back to levels':'Next level'}</button></div></section>`;document.getElementById('retry').onclick=()=>start(l.id);document.getElementById('cont').onclick=()=>l.id===levels.length?home():start(l.id+1)}function tick(){stop();S.timer=setInterval(()=>{S.left--;const t=document.getElementById('timer');if(t)t.textContent=fmt(S.left);if(S.left<=0)finish()},1000)}function fmt(s){return`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`}function speak(q,ops,v){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const tx=v?'Look at the visual pattern and choose the best answer.':q[0]+'. '+ops.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('. ');const u=new SpeechSynthesisUtterance(tx);u.rate=.9;speechSynthesis.speak(u)}homeBtn.onclick=home;resetBtn.onclick=()=>{if(confirm('Reset all saved progress?')){localStorage.removeItem(KEY);home()}};home();</script></body></html>
